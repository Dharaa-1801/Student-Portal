<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Student Hub Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header role="banner">
        <h1>STUDENT HUB PORTAL - LOGIN</h1>
    </header>

    <main id="main-content">
        <form action="profile.html" method="GET" class="card" style="max-width: 400px; margin: 2rem auto; padding: 1.5rem;">
            <h2>Student Login</h2>
            <br>
            <div class="form-group">
                <label for="student-id">Enrollment No / User ID:</label>
                <input type="text" id="student-id" name="enrollment" placeholder="25CSXXX" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="button-group">
                <button type="submit" class="btn">Login to Portal</button>
            </div>
        </form>
    </main>

</body>
</html>
