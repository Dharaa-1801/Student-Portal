<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Demo - Student Hub Portal</title>
    <style>
        :root {
            --primary-dark: #2e1065;
            --primary-light: #7c3aed;
            --accent-gold: #06b6d4;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-main);
            padding: 2rem;
            margin: 0;
        }

        .title {
            color: var(--primary-dark);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        /* Pure CSS Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary-light);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card h3 {
            color: var(--primary-dark);
            margin-top: 0;
        }

        .card p {
            color: #64748b;
            font-size: 0.95rem;
        }

        .card-stat {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <h2 class="title">Student Academic Overview (CSS Grid)</h2>

    <div class="dashboard-grid">
        <div class="card">
            <h3>Current Semester</h3>
            <p>Enrolled Course</p>
            <div class="card-stat">Semester 3</div>
        </div>
        <div class="card">
            <h3>Attendance Score</h3>
            <p>Overall Percentage</p>
            <div class="card-stat">91%</div>
        </div>
        <div class="card">
            <h3>Current CGPA</h3>
            <p>Academic Performance</p>
            <div class="card-stat">8.75</div>
        </div>
        <div class="card">
            <h3>Assignments</h3>
            <p>Pending Submissions</p>
            <div class="card-stat">02</div>
        </div>
    </div>

</body>
</html>
